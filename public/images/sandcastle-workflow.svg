<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sandcastle workflow diagram</title>
  <desc id="desc">Prompt files fan out into isolated worktrees and containers, then return reviewed commits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#15171c"/>
      <stop offset="0.55" stop-color="#22272e"/>
      <stop offset="1" stop-color="#1f332f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f4c45f"/>
      <stop offset="1" stop-color="#ef8f4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 559 C170 496 267 587 442 527 C592 475 654 362 832 385 C980 404 1042 503 1200 458 L1200 675 L0 675 Z" fill="#0f2326" opacity="0.72"/>
  <path d="M0 598 C214 538 311 635 502 575 C671 522 732 444 914 463 C1047 477 1115 535 1200 515 L1200 675 L0 675 Z" fill="#233a35" opacity="0.9"/>

  <g transform="translate(74 64)">
    <text x="0" y="0" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="760" letter-spacing="0">Sandcastle</text>
    <text x="0" y="42" fill="#b8c2bd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" letter-spacing="0">Prompt once. Run agents in isolated worktrees. Bring back commits.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="86" y="218" width="235" height="175" rx="20" fill="#f6f1df"/>
    <rect x="112" y="248" width="118" height="14" rx="7" fill="#1f2933"/>
    <rect x="112" y="282" width="160" height="10" rx="5" fill="#6a7b82"/>
    <rect x="112" y="306" width="132" height="10" rx="5" fill="#6a7b82"/>
    <rect x="112" y="330" width="174" height="10" rx="5" fill="#6a7b82"/>
    <text x="112" y="376" fill="#25313a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="760" letter-spacing="0">prompt.md</text>
  </g>

  <g transform="translate(412 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="316" height="96" rx="20" fill="#26323a" stroke="#5ea7b8" stroke-width="2"/>
    <circle cx="48" cy="48" r="20" fill="#5ea7b8"/>
    <path d="M40 48 H56 M48 40 V56" stroke="#102126" stroke-width="5" stroke-linecap="round"/>
    <text x="86" y="42" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="760" letter-spacing="0">Worktree A</text>
    <text x="86" y="70" fill="#b9c8cb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing="0">Claude Code in Docker</text>
  </g>

  <g transform="translate(412 302)" filter="url(#shadow)">
    <rect x="0" y="0" width="316" height="96" rx="20" fill="#26323a" stroke="#f0b35a" stroke-width="2"/>
    <circle cx="48" cy="48" r="20" fill="#f0b35a"/>
    <path d="M39 50 C45 38 57 39 60 50 C57 62 45 63 39 50 Z" fill="#2c2114"/>
    <text x="86" y="42" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="760" letter-spacing="0">Worktree B</text>
    <text x="86" y="70" fill="#cec3b2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing="0">Codex in Podman</text>
  </g>

  <g transform="translate(412 434)" filter="url(#shadow)">
