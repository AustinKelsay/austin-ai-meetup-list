    <path d="M39 49 H57 M49 39 L59 49 L49 59" fill="none" stroke="#132116" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="42" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="760" letter-spacing="0">Worktree C</text>
    <text x="86" y="70" fill="#bed0bf" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing="0">custom provider</text>
  </g>

  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.72">
    <path d="M321 304 C358 252 374 222 412 218"/>
    <path d="M321 304 C361 336 374 350 412 350"/>
    <path d="M321 304 C359 411 376 477 412 482"/>
    <path d="M728 218 C786 224 813 258 858 304"/>
    <path d="M728 350 C785 350 814 337 858 304"/>
    <path d="M728 482 C790 459 822 390 858 304"/>
  </g>
  <g fill="#ffffff" opacity="0.72">
    <path d="M404 211 L421 217 L406 227 Z"/>
    <path d="M404 342 L421 350 L404 358 Z"/>
    <path d="M403 475 L421 483 L404 491 Z"/>
    <path d="M850 296 L868 303 L852 314 Z"/>
  </g>

  <g transform="translate(858 218)" filter="url(#shadow)">
    <rect x="0" y="0" width="248" height="172" rx="22" fill="#f6f1df"/>
    <rect x="28" y="30" width="82" height="14" rx="7" fill="#2a3338"/>
    <rect x="28" y="66" width="190" height="12" rx="6" fill="#68787d"/>
    <rect x="28" y="94" width="154" height="12" rx="6" fill="#68787d"/>
    <rect x="28" y="122" width="106" height="12" rx="6" fill="#68787d"/>
    <path d="M164 119 L185 140 L222 94" fill="none" stroke="#2e8f68" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="155" fill="#25313a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="760" letter-spacing="0">merged commits</text>
  </g>

  <g transform="translate(84 565)">
    <rect x="0" y="0" width="1040" height="54" rx="17" fill="#10181c" opacity="0.78"/>
    <text x="28" y="35" fill="#d8e0dc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" letter-spacing="0">Branch strategies: head, merge-to-head, or explicit branch. Isolation boundary stays outside the agent loop.</text>
  </g>
